name: ROM-free tooling
on: [push, pull_request]

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ROM-free unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate cheat catalog
        run: python tools/cheat_tool.py validate config/power_rangers_the_movie_usa.cht
